patterns:
  scalarfield:
    id: P1
    visual_essence: "Heatmap, contour, isosurface, colormap on geometry"
    composes_with: [vectorfield, geom3d, processanim]
    frameworks: [matplotlib, plotly, pyvista, altair]
    ux_rules:
      - "Axes match physical units; colormaps centered on meaningful zero"
      - "Use Viridis/Cividis/Plasma for scalars; no rainbow colormaps"
      - "Label key features (maxima, minima, zero-crossings, boundaries)"
    code_template: templates/code-patterns/scalarfield.py
    gotchas:
      - "Isosurface extraction can produce topological artifacts at saddle points"
      - "Colormap interpolation may hide genuine discontinuities in the data"
      - "Log scale is required for multi-decade field magnitude spans"

  vectorfield:
    id: P2
    visual_essence: "Arrows, streamlines, LIC, glyphs, field lines"
    composes_with: [processanim, scalarfield, signalflow]
    frameworks: [matplotlib, plotly, pyvista, datashader]
    ux_rules:
      - "Adaptive glyph decimation for dense fields to prevent overlap"
      - "Vector fields must obey div/curl constraints (e.g., ∇·B = 0)"
      - "EM fields must satisfy E⊥B⊥k and correct phase relationships"
    code_template: templates/code-patterns/vectorfield.py
    gotchas:
      - "Arrow density causes visual clutter; seeding strategy changes perception"
      - "Streamline integration fails near null points without special handling"
      - "LIC texture resolution must match data resolution to avoid aliasing"

  signalflow:
    id: P3
    visual_essence: "Waveform, spectrogram, eye diagram, Bode plot"
    composes_with: [probdist, phasetraj, scalarfield]
    frameworks: [matplotlib, plotly, bokeh, pyqtgraph]
    ux_rules:
      - "Axes match physical units; log scale for multi-decade spans"
      - "Label maxima, minima, zero-crossings, and critical frequencies"
      - "Use tight_layout() or constrained_layout; autorange with margins"
    code_template: templates/code-patterns/signalflow.py
    gotchas:
      - "Spectral leakage in spectrograms requires windowing tradeoffs"
      - "Sampling rate must exceed Nyquist to avoid aliased representation"
      - "Eye diagram folding assumes periodicity that may not hold for burst signals"

  geom3d:
    id: P4
    visual_essence: "Surface, volume, mesh, lattice, cross-section"
    composes_with: [scalarfield, vectorfield, processanim]
    frameworks: [pyvista, plotly, matplotlib, threejs]
    ux_rules:
      - "Adaptive glyph decimation; avoid label/element overlap in 3D scenes"
      - "Use autorange with margins for Plotly; tight_layout for Matplotlib 3D"
      - "Interactive must be >30fps; downsample data before plotting if >100K points"
    code_template: templates/code-patterns/geom3d.py
    gotchas:
      - "Mesh resolution vs. performance tradeoff; >100K points requires downsampling"
      - "Backface culling can hide interior structures in closed volumes"
      - "3D perspective distortion can misrepresent spatial relationships"

  graphnet:
    id: P5
    visual_essence: "Nodes+edges, energy level diagram, phase diagram"
    composes_with: [processanim, probdist, signalflow]
    frameworks: [graphviz, plotly, d3js, altair]
    ux_rules:
      - "Adaptive layout to prevent node/edge/label overlap"
      - "Color + size + position only; facet or toggle for additional dimensions"
      - "Label key features (energy levels, phase boundaries, critical points)"
    code_template: templates/code-patterns/graphnet.py
    gotchas:
      - "Auto-layout algorithms can obscure true graph topology"
      - "Edge crossing density reduces readability in dense networks"
      - "Node size scaling must preserve discriminability across magnitudes"

  processanim:
    id: P6
    visual_essence: "Step-by-step morph, time evolution, particle trails"
    composes_with: [scalarfield, vectorfield, signalflow, geom3d, graphnet, probdist, phasetraj, decisionprocess]
    frameworks: [manim, matplotlib, moviepy, hyperframes]
    ux_rules:
      - "Interactive must be >30fps; pre-render if complex"
      - "Label key features at each step; use LaTeX for equations"
      - "Use tight_layout() or constrained_layout to prevent frame bleed"
    code_template: templates/code-patterns/processanim.py
    gotchas:
      - "Frame interpolation can misrepresent underlying physics or dynamics"
      - "Codec and compression choice affects text/equation legibility"
      - "Particle trail persistence can obscure current state in dense systems"

  probdist:
    id: P7
    visual_essence: "Distribution, density, histogram, box/violin"
    composes_with: [signalflow, scalarfield, processanim]
    frameworks: [matplotlib, plotly, altair, seaborn]
    ux_rules:
      - "Axes match physical units; distributions must integrate to 1 when required"
      - "Use Viridis/Cividis/Plasma; no rainbow colormaps for density"
      - "Softmax outputs, thermal distributions, and PDFs must be mathematically valid"
    code_template: templates/code-patterns/probdist.py
    gotchas:
      - "Histogram bin width biases shape perception; Freedman-Diaconis is safer"
      - "KDE bandwidth selection can hide or invent modes"
      - "Boxplots discard distributional detail that may be physically meaningful"

  phasetraj:
    id: P8
    visual_essence: "Parametric orbits, phase portrait, Poincaré section"
    composes_with: [vectorfield, processanim, scalarfield]
    frameworks: [matplotlib, plotly, bokeh, altair]
    ux_rules:
      - "Vector fields must obey physical constraints (div/curl, Hamiltonian flow)"
      - "Phase relationships and orbits must preserve physical consistency"
      - "Label fixed points, separatrices, and limit cycles"
    code_template: templates/code-patterns/phasetraj.py
    gotchas:
      - "Poincaré section sampling must capture transients before steady state"
      - "Trajectory overlap in dense phase portraits hides separatrices"
      - "Numerical integration drift can violate energy conservation visibly"

  decisionprocess:
    id: P9
    visual_essence: "Sequential choices, probabilistic outcomes, cumulative trajectories"
    composes_with: [phasetraj, probdist, graphnet, processanim]
    frameworks: [plotly, d3js, matplotlib, graphviz]
    ux_rules:
      - "Color + size + position only; facet or toggle for additional policy dimensions"
      - "Label decision nodes, branch probabilities, and cumulative rewards"
      - "Probability distributions must sum to 1; policies must be normalized"
    code_template: templates/code-patterns/decisionprocess.py
    gotchas:
      - "Probability normalization must be maintained after every branching event"
      - "Tree depth explodes horizontal layout; consider radial or hierarchical collapse"
      - "Cumulative trajectory smoothing can obscure critical decision boundaries"

interaction_tiers:
  t1_explore:
    description: "Sliders, toggles, parameter knobs — immediate visual feedback"
    rule: "Every parameter change must update the visualization within 100ms"
    best_frameworks: [plotly, bokeh, pyqtgraph, altair]

  t2_guide:
    description: "Animated walkthrough with checkpoints — structured narration"
    rule: "Follow the 5-phase storytelling arc: Hook → Deconstruct → Connect → Checkpoint → Extend"
    best_frameworks: [manim, matplotlib, hyperframes, remotion]

  t3_discover:
    description: "Open sandbox with scaffolding — creative exploration"
    rule: "Provide guardrails (valid parameter ranges, hint system) without restricting exploration"
    best_frameworks: [plotly, streamlit, threejs, d3js]

  t4_progressive_disclosure:
    description: "Start simple, reveal complexity on demand"
    rule: "Initial view shows ≤2 visual channels; additional layers exposed via toggle or zoom"
    best_frameworks: [plotly, altair, bokeh, streamlit]

  t5_what_if_scenario:
    description: "Pre-built narrative scenarios, not just sliders"
    rule: "Each scenario must tell a coherent causal story with before/after states"
    best_frameworks: [plotly, streamlit, matplotlib, manim]

  t6_ab_comparison:
    description: "Side-by-side or overlay of two configurations"
    rule: "Compared states must share identical axes, scales, and color mappings"
    best_frameworks: [plotly, matplotlib, altair, streamlit]

ux_quality_rules:
  - id: no_overlap
    rule: "Labels, arrows, and elements must not overlap; use adaptive glyph decimation for dense fields"
    enforcement: "Bounding-box check before render; reduce marker size or sample density if collision detected"

  - id: right_scale
    rule: "Axes match physical units; log scale for multi-decade spans; colormaps centered on meaningful zero"
    enforcement: "Validate axis labels include units; assert zero-centering for diverging data; switch to log for >2-decade ranges"

  - id: scientific_grounding
    rule: "Vector fields obey div/curl constraints; junction I-V follows Shockley; softmax sums to 1; distributions integrate to 1"
    enforcement: "Post-render numerical validation of physical/mathematical invariants; reject frames with >1% deviation"

  - id: max_3_visual_channels
    rule: "Use only color + size + position; facet or toggle for additional dimensions"
    enforcement: "Count active visual encodings; if >3, move the least important dimension to a facet row/column or interactive toggle"

  - id: colorblind_safe
    rule: "Viridis/Cividis/Plasma for scalars; no rainbow/jet colormaps; dark theme variant available"
    enforcement: "Colormap whitelist check at code generation; generate second figure with inverted luminance"

  - id: annotation_richness
    rule: "Key features labeled (maxima, minima, zero-crossings, boundaries); equations in LaTeX"
    enforcement: "Require ≥3 annotations per figure; validate LaTeX rendering in output"

  - id: responsive_axes
    rule: "tight_layout() or constrained_layout for Matplotlib; autorange with margins for Plotly"
    enforcement: "Assert no label cutoff or figure overflow; re-run with tight_layout if bbox extends beyond canvas"

  - id: frame_rate
    rule: "Interactive must be >30fps; downsample data before plotting if >100K points"
    enforcement: "Profile render time; if >33ms per frame, apply random or grid downsampling until target met"

  - id: physical_consistency
    rule: "EM: E⊥B⊥k; phase relationships correct; thermal distribution integrates to 1; energy conserved in phase portraits"
    enforcement: "Domain-specific invariant checks; cross-check with reference analytical solutions where available"

anti_patterns:
  - name: overlay_overload
    description: "Plotting more than 4 traces or layers in a single figure creates indistinguishable color soup"
    fix: "Max 3 visual channels; move extra dimensions to faceting, legend toggling, or secondary figures"

  - name: static_dump
    description: "Presenting all information upfront without progression or interaction leads to zero engagement"
    fix: "Apply progressive reveal, animations, or builds; start with the most salient 20% of information"

  - name: equation_vomit
    description: "Displaying math without corresponding visuals loses 90% of viewers"
    fix: "Every equation term must have a visual counterpart (glyph, color region, or animated morph)"

  - name: fake_physics
    description: "Rendering results that violate physical laws teaches incorrect intuition"
    fix: "Validate invariants before rendering: ∇·B=0, I-V follows Shockley, softmax sums to 1, energy conserved"

  - name: no_interactivity
    description: "Pure video or static image with no interactive element creates passive, low-retention learning"
    fix: "Every T2 guided experience must embed ≥1 interactive element (slider, click, or checkpoint question)"
