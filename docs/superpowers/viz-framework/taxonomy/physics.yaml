domain: physics
sub_disciplines:
  electromagnetism:
    concepts:
      - name: electrostatic_field
        primary_pattern: vectorfield
        secondary_patterns: [scalarfield]
        best_framework: plotly
        alt_framework: pyvista
        interaction_tiers: [t1, t2, t3]
        ux_rules:
          - "Equipotential contours must be orthogonal to E-field arrows"
          - "Arrow length proportional to |E|, adaptive sampling near charges"
        gotchas:
          - "Quiver scaling - normalize or users see nothing or chaos"
      - name: magnetic_flux
        primary_pattern: vectorfield
        secondary_patterns: [signalflow]
        best_framework: matplotlib
        alt_framework: plotly
        interaction_tiers: [t1, t2]
        ux_rules:
          - "B-field lines must close (del *B=0) - no broken lines"
          - "Show induced EMF as time-series alongside field"
        gotchas:
          - "streamplot seed points must sample domain uniformly"
      - name: maxwell_equations
        primary_pattern: vectorfield
        secondary_patterns: [processanim, scalarfield]
        best_framework: manim
        alt_framework: plotly
        interaction_tiers: [t2, t4]
        ux_rules:
          - "Animate each equation term with corresponding field visualization"
          - "Color-code E-field (blue) and B-field (red) consistently"
        gotchas:
          - "Static display of all 4 equations overwhelms - use progressive disclosure"
      - name: em_wave_propagation
        primary_pattern: vectorfield
        secondary_patterns: [processanim, geom3d]
        best_framework: plotly
        alt_framework: pyvista
        interaction_tiers: [t1, t2, t5]
        ux_rules:
          - "E_|_B_|_k orientation must be correct in 3D view"
          - "Show wavelength and period annotations"
        gotchas:
          - "Wrong phase relationship between E and B destroys physical credibility"
      - name: skin_effect
        primary_pattern: scalarfield
        secondary_patterns: [signalflow]
        best_framework: matplotlib
        alt_framework: plotly
        interaction_tiers: [t1, t4]
        ux_rules:
          - "Log scale for current density vs depth"
          - "Annotate skin depth delta at 1/e point"
        gotchas:
          - "Linear scale hides rapid decay in good conductors"
      - name: poynting_vector
        primary_pattern: vectorfield
        secondary_patterns: [scalarfield]
        best_framework: plotly
        alt_framework: matplotlib
        interaction_tiers: [t1, t2]
        ux_rules:
          - "S = E x B direction must be explicitly shown"
          - "Magnitude colormap matched to power flow density"
        gotchas:
          - "Cross product direction errors are common - validate with right-hand rule"
      - name: waveguide_modes
        primary_pattern: scalarfield
        secondary_patterns: [vectorfield, geom3d]
        best_framework: plotly
        alt_framework: pyvista
        interaction_tiers: [t1, t4]
        ux_rules:
          - "Show cutoff frequency annotation for each mode"
          - "Cross-section view must reveal transverse field pattern"
        gotchas:
          - "TE vs TM mode field patterns easily confused - label explicitly"
      - name: boundary_conditions
        primary_pattern: scalarfield
        secondary_patterns: [vectorfield, processanim]
        best_framework: manim
        alt_framework: plotly
        interaction_tiers: [t2, t4]
        ux_rules:
          - "Animate field behavior as wave hits boundary"
          - "Label tangential E continuity and normal D discontinuity"
        gotchas:
          - "Sign errors in reflected wave phase common at conducting boundaries"
  classical_mechanics:
    concepts:
      - name: kinematics
        primary_pattern: phasetraj
        secondary_patterns: [processanim]
        best_framework: plotly
        alt_framework: matplotlib
        interaction_tiers: [t1, t2]
        ux_rules:
          - "Position, velocity, acceleration stacked subplots with synchronized time axis"
          - "Animate point along trajectory with velocity vector"
        gotchas:
          - "Confusing position-time slope with velocity magnitude"
      - name: dynamics
        primary_pattern: phasetraj
        secondary_patterns: [vectorfield]
        best_framework: plotly
        alt_framework: matplotlib
        interaction_tiers: [t1, t2, t3]
        ux_rules:
          - "Free-body diagram overlay on motion visualization"
          - "Force vectors scale with magnitude, origin at center of mass"
        gotchas:
          - "Action-reaction pairs drawn on same body instead of separate bodies"
      - name: harmonic_oscillator
        primary_pattern: phasetraj
        secondary_patterns: [signalflow, processanim]
        best_framework: matplotlib
        alt_framework: plotly
        interaction_tiers: [t1, t2, t4]
        ux_rules:
          - "Phase portrait must be ellipse for undamped, spiral for damped"
          - "Show energy exchange between kinetic and potential"
        gotchas:
          - "Phase portrait aspect ratio distortion breaks ellipse shape"
      - name: resonance
        primary_pattern: signalflow
        secondary_patterns: [scalarfield]
        best_framework: matplotlib
        alt_framework: plotly
        interaction_tiers: [t1, t5]
        ux_rules:
          - "Amplitude response peak annotated with Q-factor"
          - "Phase shift passes through +/-90 deg at resonance"
        gotchas:
          - "Insufficient frequency resolution near sharp resonance peak"
      - name: wave_equation
        primary_pattern: processanim
        secondary_patterns: [scalarfield, signalflow]
        best_framework: matplotlib
        alt_framework: plotly
        interaction_tiers: [t1, t2]
        ux_rules:
          - "Fixed y-axis across animation frames"
          - "Superposition principle demonstrated with toggleable components"
        gotchas:
          - "Auto-scaling y-axis makes standing waves disappear visually"
      - name: coupled_oscillators
        primary_pattern: processanim
        secondary_patterns: [phasetraj, signalflow]
        best_framework: plotly
        alt_framework: matplotlib
        interaction_tiers: [t1, t2, t4]
        ux_rules:
          - "Show normal modes as separate toggleable views"
          - "Energy flow between oscillators animated"
        gotchas:
          - "Beating phenomenon requires long time window to be visible"
      - name: lagrangian_mechanics
        primary_pattern: graphnet
        secondary_patterns: [phasetraj]
        best_framework: manim
        alt_framework: tikz
        interaction_tiers: [t2, t4]
        ux_rules:
          - "Energy terms color-coded: T (kinetic) vs V (potential)"
          - "Euler-Lagrange derivation step-by-step with visual links"
        gotchas:
          - "Generalized coordinates without physical picture confuse learners"
      - name: hamiltonian_mechanics
        primary_pattern: phasetraj
        secondary_patterns: [graphnet]
        best_framework: plotly
        alt_framework: matplotlib
        interaction_tiers: [t2, t4]
        ux_rules:
          - "Phase space trajectories must preserve area (Liouville)"
          - "Show Hamiltonian as constant energy surface"
        gotchas:
          - "Numerical integration drift causes artificial energy loss"

  thermodynamics:
    concepts:
      - name: heat_transfer
        primary_pattern: scalarfield
        secondary_patterns: [processanim]
        best_framework: plotly
        alt_framework: matplotlib
        interaction_tiers: [t1, t2]
        ux_rules:
          - "Temperature colormap fixed across time steps"
          - "Show isotherms and heat flux arrows"
        gotchas:
          - "Steady-state vs transient solutions have very different time scales"
      - name: carnot_cycle
        primary_pattern: graphnet
        secondary_patterns: [processanim, signalflow]
        best_framework: matplotlib
        alt_framework: plotly
        interaction_tiers: [t2, t4]
        ux_rules:
          - "P-V diagram with direction arrows for each process"
          - "Temperature reservoirs shown with distinct colors"
        gotchas:
          - "Reversible vs irreversible paths look identical without entropy annotation"
      - name: entropy
        primary_pattern: probdist
        secondary_patterns: [scalarfield]
        best_framework: matplotlib
        alt_framework: altair
        interaction_tiers: [t2, t4]
        ux_rules:
          - "Microstate counting visualized as configuration space"
          - "Boltzmann S = k ln W shown with combinatorial example"
        gotchas:
          - "Entropy decrease in local systems confuses without reservoir context"
      - name: free_energy
        primary_pattern: scalarfield
        secondary_patterns: [graphnet]
        best_framework: plotly
        alt_framework: matplotlib
        interaction_tiers: [t1, t4]
        ux_rules:
          - "Helmholtz vs Gibbs free energy labeled with control variables"
          - "Minimization direction shown with gradient arrows"
        gotchas:
          - "Mixing up natural variables (T,V vs T,P) for each potential"
      - name: phase_transitions
        primary_pattern: graphnet
        secondary_patterns: [scalarfield, processanim]
        best_framework: plotly
        alt_framework: matplotlib
        interaction_tiers: [t1, t2, t5]
        ux_rules:
          - "Phase diagram with coexistence curves and critical point"
          - "Latent heat shown as energy bar during transition"
        gotchas:
          - "First-order vs second-order transitions confused without entropy continuity"
      - name: partition_function
        primary_pattern: probdist
        secondary_patterns: [scalarfield]
        best_framework: matplotlib
        alt_framework: plotly
        interaction_tiers: [t2, t4]
        ux_rules:
          - "Energy level occupations shown as bar chart at given T"
          - "Z normalization ensures probabilities sum to 1"
        gotchas:
          - "Degeneracy factors g_i often omitted in simple examples"

  quantum_mechanics:
    concepts:
      - name: wavefunction_probability
        primary_pattern: probdist
        secondary_patterns: [scalarfield, processanim]
        best_framework: plotly
        alt_framework: matplotlib
        interaction_tiers: [t1, t2]
        ux_rules:
          - "|psi|^2 must be non-negative and integrate to 1"
          - "Show both real/imaginary parts and probability density"
        gotchas:
          - "Plotting psi instead of |psi|^2 gives negative values - label carefully"
      - name: schrodinger_evolution
        primary_pattern: processanim
        secondary_patterns: [scalarfield, probdist]
        best_framework: matplotlib
        alt_framework: plotly
        interaction_tiers: [t1, t2]
        ux_rules:
          - "Probability density norm conserved - check integral each frame"
          - "Phase evolution shown as hue on probability density"
        gotchas:
          - "Imaginary time propagation used for ground state looks like real evolution"
      - name: quantum_tunnelling
        primary_pattern: scalarfield
        secondary_patterns: [processanim, probdist]
        best_framework: plotly
        alt_framework: matplotlib
        interaction_tiers: [t1, t2, t4]
        ux_rules:
          - "Barrier region clearly demarcated with energy level"
          - "Transmission coefficient annotated for barrier height/width"
        gotchas:
          - "Classical turning points confused with barrier edges"
      - name: energy_levels_band_structure
        primary_pattern: graphnet
        secondary_patterns: [scalarfield]
        best_framework: plotly
        alt_framework: matplotlib
        interaction_tiers: [t1, t4]
        ux_rules:
          - "Discrete levels for quantum well, continuous bands for solid"
          - "Fermi level position shown relative to band edges"
        gotchas:
          - "Infinite vs finite well energy spacing scaling differs"
      - name: superposition_entanglement
        primary_pattern: processanim
        secondary_patterns: [graphnet, probdist]
        best_framework: manim
        alt_framework: plotly
        interaction_tiers: [t2, t4]
        ux_rules:
          - "Bloch sphere visualization for single-qubit states"
          - "Measurement collapses shown as probabilistic branches"
        gotchas:
          - "Entanglement correlation vs classical correlation needs Bell test context"
      - name: quantum_harmonic_oscillator
        primary_pattern: probdist
        secondary_patterns: [scalarfield, phasetraj]
        best_framework: plotly
        alt_framework: matplotlib
        interaction_tiers: [t1, t4]
        ux_rules:
          - "Hermite polynomial nodes matched to wavefunction zero crossings"
          - "Energy spacing hbaromega constant - annotate levels"
        gotchas:
          - "Classical probability distribution peaking at edges vs quantum peaking at center"
      - name: spin_precession
        primary_pattern: phasetraj
        secondary_patterns: [processanim]
        best_framework: plotly
        alt_framework: matplotlib
        interaction_tiers: [t1, t2]
        ux_rules:
          - "Bloch sphere precession around B-field axis"
          - "Larmor frequency annotation"
        gotchas:
          - "Confusing Rabi oscillation with Larmor precession"

  optics:
    concepts:
      - name: interference
        primary_pattern: scalarfield
        secondary_patterns: [processanim]
        best_framework: plotly
        alt_framework: matplotlib
        interaction_tiers: [t1, t2]
        ux_rules:
          - "Path difference annotated as lambda/2, lambda, etc."
          - "Intensity pattern fixed scale - bright/dark fringes visible"
        gotchas:
          - "Coherence length limit often omitted in idealized double-slit"
      - name: diffraction
        primary_pattern: scalarfield
        secondary_patterns: [probdist]
        best_framework: matplotlib
        alt_framework: plotly
        interaction_tiers: [t1, t4]
        ux_rules:
          - "Single-slit sinc^2 pattern with minima at mlambda/a"
          - "Aperture shape linked to Fourier transform of pattern"
        gotchas:
          - "Fraunhofer vs Fresnel regimes have very different patterns"
      - name: polarization
        primary_pattern: vectorfield
        secondary_patterns: [processanim]
        best_framework: plotly
        alt_framework: matplotlib
        interaction_tiers: [t1, t2]
        ux_rules:
          - "E-field tip traces polarization ellipse in 3D"
          - "Stokes parameters or Jones vector annotation"
        gotchas:
          - "Linear vs circular vs elliptical polarization confused without handedness"
      - name: fourier_optics
        primary_pattern: scalarfield
        secondary_patterns: [signalflow]
        best_framework: matplotlib
        alt_framework: plotly
        interaction_tiers: [t1, t4]
        ux_rules:
          - "Aperture function and its Fourier transform shown side-by-side"
          - "Spatial frequency axis labeled in cycles/mm"
        gotchas:
          - "DC component magnitude dominates - log scale needed for side lobes"
      - name: dispersion
        primary_pattern: signalflow
        secondary_patterns: [processanim]
        best_framework: plotly
        alt_framework: matplotlib
        interaction_tiers: [t1, t5]
        ux_rules:
          - "Pulse spreading shown as function of propagation distance"
          - "Group velocity vs phase velocity annotated"
        gotchas:
          - "Anomalous vs normal dispersion sign convention varies by field"

  condensed_matter:
    concepts:
      - name: crystal_lattices
        primary_pattern: geom3d
        secondary_patterns: [graphnet]
        best_framework: pyvista
        alt_framework: plotly
        interaction_tiers: [t1, t3]
        ux_rules:
          - "Rotate to reveal symmetry axes (4-fold, 6-fold)"
          - "Lattice vectors a1, a2, a3 labeled with lengths"
        gotchas:
          - "Primitive vs conventional cell confusion - offer both views"
      - name: reciprocal_space
        primary_pattern: geom3d
        secondary_patterns: [scalarfield]
        best_framework: plotly
        alt_framework: matplotlib
        interaction_tiers: [t2, t4]
        ux_rules:
          - "Show construction from Fourier transform of real lattice"
          - "First Brillouin zone highlighted"
        gotchas:
          - "b1, b2 directions not simply perpendicular to a1, a2 in non-cubic systems"
      - name: band_structure
        primary_pattern: graphnet
        secondary_patterns: [scalarfield]
        best_framework: plotly
        alt_framework: matplotlib
        interaction_tiers: [t1, t4]
        ux_rules:
          - "High-symmetry k-path labeled (Gamma->X->M->Gamma)"
          - "Direct vs indirect gap shown with photon/electron arrows"
        gotchas:
          - "Band folding in superlattices obscures original bands"
      - name: phonons
        primary_pattern: signalflow
        secondary_patterns: [processanim, graphnet]
        best_framework: plotly
        alt_framework: matplotlib
        interaction_tiers: [t1, t4]
        ux_rules:
          - "Dispersion relation omega(q) with acoustic and optical branches"
          - "Atomic displacement eigenvectors animated"
        gotchas:
          - "Optical branch flatness mistaken for zero group velocity everywhere"
      - name: doping_carrier_statistics
        primary_pattern: probdist
        secondary_patterns: [graphnet]
        best_framework: matplotlib
        alt_framework: plotly
        interaction_tiers: [t1, t4]
        ux_rules:
          - "Fermi-Dirac distribution at T=0 and T>0 overlaid"
          - "n-type vs p-type shown with donor/acceptor levels"
        gotchas:
          - "Degeneracy factor differences between electrons and holes"
      - name: pn_junction
        primary_pattern: scalarfield
        secondary_patterns: [graphnet, processanim]
        best_framework: plotly
        alt_framework: matplotlib
        interaction_tiers: [t1, t2, t4]
        ux_rules:
          - "Depletion width scales with sqrt(Vbi - V)"
          - "Band bending aligned with charge density and E-field"
        gotchas:
          - "Built-in potential sign convention reversed in device vs chemistry contexts"
