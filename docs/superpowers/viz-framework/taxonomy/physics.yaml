  fluid_dynamics:
    concepts:
      - name: navier_stokes_field
        primary_pattern: vectorfield
        secondary_patterns: [scalarfield, geom3d]
        best_framework: pyvista
        alt_framework: plotly
        interaction_tiers: [t1, t2, t3, t4]
        ux_rules:
          - "Velocity field u(x,t) as streamlines colored by speed magnitude"
          - "Pressure field p(x,t) as background scalar colormap"
          - "Vorticity omega = curl(u) shown as separate field with distinct colormap"
          - "Incompressibility condition div(u) = 0 verified numerically on plot"
        gotchas:
          - "Reynolds number Re determines laminar (Re<2300) vs turbulent (Re>4000) regime"
          - "Incompressible NS requires solving pressure Poisson equation — not explicit in time"
          - "Boundary layer thickness grows as sqrt(nu*t) — resolve with fine mesh near walls"
      - name: bernoulli_flow
        primary_pattern: signalflow
        secondary_patterns: [vectorfield]
        best_framework: matplotlib
        alt_framework: plotly
        interaction_tiers: [t1, t2, t3]
        ux_rules:
          - "Streamline with labeled sampling points showing P + 1/2*rho*v^2 + rho*g*h = constant"
          - "Pressure, velocity, and elevation contributions as stacked bar chart along streamline"
          - "Venturi effect: velocity up, pressure down at constriction — annotated clearly"
          - "Stagnation point where v=0, P = P_total marked with bullseye"
        gotchas:
          - "Bernoulli only valid along same streamline for rotational flow"
          - "Unsteady flow: add term d(phi)/dt or use unsteady Bernoulli"
          - "Compressibility corrections needed for Mach > 0.3"
      - name: turbulence_vorticity
        primary_pattern: geom3d
        secondary_patterns: [vectorfield, signalflow]
        best_framework: pyvista
        alt_framework: matplotlib
        interaction_tiers: [t1, t2, t3, t4]
        ux_rules:
          - "Vortex tubes rendered as 3D isosurfaces of |omega|"
          - "Energy spectrum E(k) ~ k^(-5/3) in inertial range shown on log-log plot"
          - "Kolmogorov scales (eta, tau_eta, u_eta) annotated as vertical lines"
          - "Velocity fluctuation RMS plotted vs distance from wall (wall units y+)"
        gotchas:
          - "Direct Numerical Simulation (DNS) requires N^3 ~ Re^(9/4) grid points — intractable above moderate Re"
          - "Energy cascade assumes local isotropy — not valid near walls or for stratified flows"
          - "k^(-5/3) law holds only in inertial subrange between integral and Kolmogorov scales"
      - name: boundary_layer
        primary_pattern: signalflow
        secondary_patterns: [vectorfield, scalarfield]
        best_framework: matplotlib
        alt_framework: plotly
        interaction_tiers: [t1, t2, t3, t5]
        ux_rules:
          - "Velocity profile u(y) from wall (y=0) to freestream with boundary layer thickness delta"
          - "Laminar, transitional, and turbulent velocity profiles overlaid with distinct styles"
          - "Wall shear stress tau_w as slope at y=0 annotated tangentially"
          - "Displacement thickness delta* and momentum thickness theta as shaded areas"
        gotchas:
          - "Blasius solution (laminar) self-similar in eta = y*sqrt(U/(nu*x)) — similarity variable"
          - "Transition Reynolds number Re_x ~ 5e5 for flat plate — depends on free-stream turbulence"
          - "Turbulent BL thicker than laminar — skin friction higher but separation resistance better"
      - name: shockwave
        primary_pattern: scalarfield
        secondary_patterns: [vectorfield, signalflow]
        best_framework: pyvista
        alt_framework: matplotlib
        interaction_tiers: [t1, t2, t3, t5]
        ux_rules:
          - "Schlieren-style density gradient visualization (|grad rho| magnitude)"
          - "Upstream (supersonic) and downstream (subsonic) labeled with Mach numbers"
          - "Oblique shock angle beta vs deflection angle theta plotted on theta-beta-M diagram"
          - "Normal shock relations: P2/P1, rho2/rho1, T2/T1 annotated across discontinuity"
        gotchas:
          - "Rankine-Hugoniot jump conditions conserve mass, momentum, energy across shock"
          - "Oblique shock detaches beyond maximum deflection angle for given Mach"
          - "Expansion fans (Prandtl-Meyer) are smooth, not discontinuous — opposite of compression"
      - name: streamlines_potential
        primary_pattern: vectorfield
        secondary_patterns: [scalarfield]
        best_framework: matplotlib
        alt_framework: plotly
        interaction_tiers: [t1, t2, t3]
        ux_rules:
          - "Streamlines (psi = const) and equipotential lines (phi = const) form orthogonal grid"
          - "Source/sink: radial streamlines; vortex: circular streamlines; doublet: cardioid pattern"
          - "Superposition: show how combining elementary flows creates flow past cylinder"
          - "Stagnation points circled where velocity magnitude drops to zero"
        gotchas:
          - "Potential flow: irrotational (curl(u)=0) and incompressible (div(u)=0) — no viscosity"
          - "D'Alembert's paradox: zero drag for potential flow past body — no boundary layer separation"
          - "Kutta-Joukowski theorem: lift = rho*U*Gamma — circulation Gamma due to sharp trailing edge"
      - name: convection_cell
        primary_pattern: processanim
        secondary_patterns: [scalarfield, vectorfield]
        best_framework: manim
        alt_framework: plotly
        interaction_tiers: [t1, t2, t3, t4, t5]
        ux_rules:
          - "Rayleigh-Benard rolls: hot fluid rises (center), cold fluid sinks (edges)"
          - "Temperature field T(x,y,t) as background colormap with velocity vectors overlaid"
          - "Rayleigh number Ra = g*alpha*deltaT*H^3/(nu*kappa) displayed with threshold"
          - "Nusselt number Nu = heat_transfer_with_convection / conductive_only shown vs Ra"
        gotchas:
          - "Critical Rayleigh number Ra_c ~ 1708 for onset of convection between rigid plates"
          - "At high Ra, rolls become unsteady then turbulent — period-doubling route to chaos"
          - "Boussinesq approximation: density variation only in buoyancy term — fails for large deltaT"
