          - "CLIP is strong at broad categories, weak at fine-grained (dog breeds, car models) — training data bias"
          - "Text encoder is crucial — 'a photo of {}' template choice affects zero-shot accuracy by 5-10%"
      - name: cross_modal_attention
        primary_pattern: graphnet
        secondary_patterns: [scalarfield]
        best_framework: matplotlib
        alt_framework: bertviz
        interaction_tiers: [t1, t2, t3]
        ux_rules:
          - "Cross-attention matrix: text tokens (Q) attend to image patches (K,V) — alignment score heatmap"
          - "Attention overlay on image: highlight which regions each text token attends to"
          - "Modality gap: distribution of text-text, image-image, and text-image similarities in joint space"
          - "Fusion strategies: early fusion (concatenate before transformer) vs late fusion (separate encoders + cross-attention)"
        gotchas:
          - "Cross-attention has O(n_text * n_image_patches) complexity — for 16x16 grid + 77 tokens = manageable, not 336x336"
          - "Modality gap: CLIP embeddings cluster by modality — cosine sim within modality > across modality"
          - "Fine-grained alignment (word to image region) requires explicit supervision or pretraining"
      - name: text_to_image
        primary_pattern: processanim
        secondary_patterns: [scalarfield, graphnet]
        best_framework: matplotlib
        alt_framework: manim
        interaction_tiers: [t1, t2, t3, t4]
        ux_rules:
          - "Prompt → text encoder → diffusion model → VAE decoder → image — pipeline annotated"
          - "Denoising progression: noise → rough shapes → details → sharp image across timesteps"
          - "CFG (classifier-free guidance): unconditional + conditional outputs — guidance scale w slider"
          - "Prompt following accuracy: highlighted regions matching each prompt phrase"
        gotchas:
          - "CFG scale > 7.5 oversaturates colors and creates artifacts — 5-7 is typical sweet spot"
          - "VAE decoder adds artifacts (blur, compression artifacts) — upscaling model (refiner) fixes some"
          - "Multiple subjects interact poorly (concept bleeding) — attention-based compositional generation helps"
      - name: vqa_pipeline
