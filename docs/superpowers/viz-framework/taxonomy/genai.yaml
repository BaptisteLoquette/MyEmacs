domain: genai
sub_disciplines:
  transformer_internals:
    concepts:
      - name: multi_head_attention_heatmaps
        primary_pattern: scalarfield
        secondary_patterns: [graphnet]
        best_framework: bertviz
        alt_framework: plotly
        interaction_tiers: [t1, t2]
        ux_rules:
          - "Attention weights normalized per head (row-wise softmax)"
          - "Token positions aligned between query and key axes"
        gotchas:
          - "Attention weights are not explanations - high weight != high importance"
      - name: attention_flow_across_layers
        primary_pattern: graphnet
        secondary_patterns: [processanim]
        best_framework: plotly
        alt_framework: matplotlib
        interaction_tiers: [t1, t2]
        ux_rules:
          - "Layer-by-layer attention path animated with token highlighting"
          - "Residual connections shown as bypass routes"
        gotchas:
          - "Copying behavior in lower layers vs abstract matching in upper layers"
      - name: qkv_projections
        primary_pattern: graphnet
        secondary_patterns: [scalarfield]
        best_framework: plotly
        alt_framework: matplotlib
        interaction_tiers: [t2, t4]
        ux_rules:
          - "Q, K, V matrices as 3D tensor slices with projection dimensions"
          - "Attention score computation as dot-product heatmap"
        gotchas:
          - "Scale factor 1/sqrtdk critical - omitting causes gradient instability"
      - name: residual_stream_analysis
        primary_pattern: signalflow
        secondary_patterns: [graphnet]
        best_framework: plotly
        alt_framework: matplotlib
        interaction_tiers: [t2, t4]
        ux_rules:
          - "Layer norm and residual addition shown as stream operators"
          - "Activation norm growth monitored across depth"
        gotchas:
          - "Residual stream interpretation conflates token and position information"
      - name: logit_lens_early_exiting
        primary_pattern: probdist
        secondary_patterns: [signalflow]
        best_framework: plotly
        alt_framework: matplotlib
        interaction_tiers: [t1, t4]
        ux_rules:
          - "Top-k predictions from each layer vs final output"
          - "Confidence trajectory with early-exit threshold"
        gotchas:
          - "Layer norm before unembedding changes distribution shape significantly"
      - name: positional_encoding
        primary_pattern: scalarfield
        secondary_patterns: [signalflow]
        best_framework: matplotlib
        alt_framework: plotly
        interaction_tiers: [t1, t4]
        ux_rules:
          - "Sinusoid wavelengths span from 2pi to 2pi*10000"
          - "Relative position encoding matrix symmetric about diagonal"
        gotchas:
          - "Length generalization failure when test sequence exceeds training max_len"
  diffusion_models:
    concepts:
      - name: noise_schedule
        primary_pattern: signalflow
        secondary_patterns: [probdist]
        best_framework: matplotlib
        alt_framework: plotly
        interaction_tiers: [t1, t4]
        ux_rules:
          - "alpha(t) and beta(t) curves with signal-to-noise ratio"
          - "Schedule comparison: linear, cosine, sigmoid"
        gotchas:
          - "Cosine schedule underestimates noise at very early steps"
      - name: denoising_trajectory_grid
        primary_pattern: processanim
        secondary_patterns: [scalarfield, probdist]
        best_framework: matplotlib
        alt_framework: plotly
        interaction_tiers: [t1, t2]
        ux_rules:
          - "Fixed color scale across all timesteps"
          - "Trajectory path in latent space overlaid"
        gotchas:
          - "Different random seeds produce visually different but equally valid trajectories"
      - name: score_function
        primary_pattern: vectorfield
        secondary_patterns: [scalarfield]
        best_framework: plotly
        alt_framework: matplotlib
        interaction_tiers: [t1, t4]
        ux_rules:
          - "Score vectors pointing toward high data density"
          - "Magnitude colormap on log scale for visibility"
        gotchas:
          - "Score estimation noisy in low-density regions - Langevin dynamics helps"
      - name: classifier_free_guidance
        primary_pattern: decisionprocess
        secondary_patterns: [probdist]
        best_framework: plotly
        alt_framework: matplotlib
        interaction_tiers: [t1, t6]
        ux_rules:
          - "Guidance scale w slider from 0 (unconditional) to high (overcooked)"
          - "Compare conditional vs unconditional score side-by-side"
        gotchas:
          - "High guidance causes mode collapse and artifact saturation"
      - name: latent_diffusion_space
        primary_pattern: geom3d
        secondary_patterns: [probdist]
        best_framework: plotly
        alt_framework: umap-learn
        interaction_tiers: [t1, t3]
        ux_rules:
          - "VAE latent space with decoder reconstructions at grid points"
          - "Interpolation paths smooth and semantically meaningful"
        gotchas:
          - "Latent space holes cause poor reconstruction - prior must cover support"
      - name: flow_matching_consistency
        primary_pattern: processanim
        secondary_patterns: [vectorfield]
        best_framework: plotly
        alt_framework: matplotlib
        interaction_tiers: [t1, t2]
        ux_rules:
          - "Straight-line probability flow vs curved diffusion path"
          - "Consistency model single-step vs multi-step comparison"
        gotchas:
          - "Flow matching requires probability path specification - wrong path = wrong marginals"
  embeddings_latent_space:
    concepts:
      - name: token_embedding_projection
        primary_pattern: geom3d
        secondary_patterns: [graphnet]
        best_framework: plotly
        alt_framework: umap-learn
        interaction_tiers: [t1, t3]
        ux_rules:
          - "UMAP or t-SNE with perplexity slider"
          - "Semantic clusters labeled with representative tokens"
        gotchas:
          - "Dimensionality reduction distorts global distances - trust local neighborhoods only"
      - name: semantic_arithmetic
        primary_pattern: vectorfield
        secondary_patterns: [geom3d]
        best_framework: plotly
        alt_framework: matplotlib
        interaction_tiers: [t1, t3]
        ux_rules:
          - "Vector addition/subtraction in embedding space with result nearest neighbors"
          - "King - Man + Woman ~= Queen trajectory shown"
        gotchas:
          - "Analogy accuracy varies by language and embedding training data"
      - name: layer_wise_representation_evolution
        primary_pattern: processanim
        secondary_patterns: [probdist]
        best_framework: plotly
        alt_framework: matplotlib
        interaction_tiers: [t1, t2]
        ux_rules:
          - "Token representation trajectory through layer depth"
          - "Classification confidence evolution vs layer index"
        gotchas:
          - "Early layers more syntactic, late layers more semantic - but not strictly linear"
      - name: embedding_similarity_matrix
        primary_pattern: scalarfield
        secondary_patterns: [graphnet]
        best_framework: plotly
        alt_framework: matplotlib
        interaction_tiers: [t1, t4]
        ux_rules:
          - "Cosine similarity heatmap with diagonal self-similarity = 1"
          - "Hierarchical clustering dendrogram alongside"
        gotchas:
          - "Cosine similarity insensitive to vector magnitude - Euclidean may reveal more"

  neural_network_architecture:
    concepts:
      - name: model_architecture_diagram
        primary_pattern: graphnet
        secondary_patterns: [geom3d]
        best_framework: graphviz
        alt_framework: tikz
        interaction_tiers: [t1, t4]
        ux_rules:
          - "Layer dimensions and parameter counts annotated"
          - "Skip/residual connections clearly distinguished from sequential flow"
        gotchas:
          - "Auto-generated diagrams from code often omit data shape annotations"
      - name: autograd_computation_graph
        primary_pattern: graphnet
        secondary_patterns: [processanim]
        best_framework: graphviz
        alt_framework: plotly
        interaction_tiers: [t2, t4]
        ux_rules:
          - "Forward pass top-to-bottom, backward pass bottom-to-top gradient flow"
          - "Tensor shapes at each node validate broadcasting"
        gotchas:
          - "In-place operations break computation graph - highlight with warnings"
      - name: parameter_distribution
        primary_pattern: probdist
        secondary_patterns: [scalarfield]
        best_framework: matplotlib
        alt_framework: plotly
        interaction_tiers: [t1, t4]
        ux_rules:
          - "Histogram per layer with mean, std, and sparsity annotated"
          - "Weight initialization distribution overlaid for comparison"
        gotchas:
          - "BatchNorm running stats vs training stats must be distinguished"
      - name: attention_head_diversity
        primary_pattern: probdist
        secondary_patterns: [scalarfield]
        best_framework: plotly
        alt_framework: matplotlib
        interaction_tiers: [t1, t4]
        ux_rules:
          - "Intra-head similarity matrix and head redundancy metric"
          - "Pruned heads marked with performance impact"
        gotchas:
          - "Some heads are language-specific - diversity depends on training corpus"
      - name: throughput_memory_analysis
        primary_pattern: graphnet
        secondary_patterns: [signalflow]
        best_framework: plotly
        alt_framework: matplotlib
        interaction_tiers: [t1, t5]
        ux_rules:
          - "Roofline model with arithmetic intensity and bandwidth ceiling"
          - "Memory footprint breakdown: weights, activations, optimizer states"
        gotchas:
          - "Activation checkpointing trades compute for memory - show crossover point"
  training_dynamics:
    concepts:
      - name: loss_curves_metrics
        primary_pattern: signalflow
        secondary_patterns: [graphnet]
        best_framework: matplotlib
        alt_framework: plotly
        interaction_tiers: [t1, t4]
        ux_rules:
          - "Train and validation curves on log scale with early stopping marker"
          - "Learning rate warm-up and decay overlaid as secondary axis"
        gotchas:
          - "Validation loss increase may precede overfitting by many epochs"
      - name: learning_rate_schedule
        primary_pattern: signalflow
        secondary_patterns: [probdist]
        best_framework: matplotlib
        alt_framework: plotly
        interaction_tiers: [t1, t4]
        ux_rules:
          - "Step, cosine, polynomial, and warm-up schedules compared"
          - "Effective learning rate with Adam beta correction shown"
        gotchas:
          - "Cosine annealing restart period must match convergence timescale"
      - name: gradient_flow_norm_analysis
        primary_pattern: signalflow
        secondary_patterns: [scalarfield]
        best_framework: matplotlib
        alt_framework: plotly
        interaction_tiers: [t1, t4]
        ux_rules:
          - "Gradient norm per layer across training steps"
          - "Vanishing vs exploding gradient thresholds marked"
        gotchas:
          - "Gradient clipping changes optimization trajectory - not just numerical stability"
      - name: weight_update_statistics
        primary_pattern: probdist
        secondary_patterns: [signalflow]
        best_framework: matplotlib
        alt_framework: plotly
        interaction_tiers: [t1, t4]
        ux_rules:
          - "Update/weight ratio histogram (effective learning rate per parameter)"
          - "Adam momentum and second moment trajectories"
        gotchas:
          - "Large batch training requires learning rate scaling - linear or sqrt rule"
      - name: scaling_laws_visualization
        primary_pattern: signalflow
        secondary_patterns: [probdist]
        best_framework: plotly
        alt_framework: matplotlib
        interaction_tiers: [t1, t5]
        ux_rules:
          - "Loss vs compute, parameters, data size on log-log axes"
          - "Iso-loss contours for model-data trade-offs"
        gotchas:
          - "Power-law breaks at small scale due to irreducible loss"
  generation_analysis:
    concepts:
      - name: token_probability_distribution
        primary_pattern: probdist
        secondary_patterns: [signalflow]
        best_framework: plotly
        alt_framework: matplotlib
        interaction_tiers: [t1, t4]
        ux_rules:
          - "Top-k probabilities bar chart with temperature-scaled softmax"
          - "Entropy and perplexity annotated per position"
        gotchas:
          - "Temperature > 1 flattens distribution but does not increase diversity monotonically"
      - name: beam_search_tree
        primary_pattern: graphnet
        secondary_patterns: [decisionprocess]
        best_framework: plotly
        alt_framework: graphviz
        interaction_tiers: [t1, t2]
        ux_rules:
          - "Tree depth = sequence length, beam width = branching factor"
          - "Score annotations on each node with normalized log-prob"
        gotchas:
          - "Beam search often produces repetitive sequences - diversity penalties needed"
      - name: sampling_strategy_comparison
        primary_pattern: probdist
        secondary_patterns: [decisionprocess]
        best_framework: plotly
        alt_framework: matplotlib
        interaction_tiers: [t1, t6]
        ux_rules:
          - "Greedy, beam, top-k, nucleus, temperature samples side-by-side"
          - "Diversity vs quality trade-off with quantitative metrics"
        gotchas:
          - "Nucleus sampling p threshold interacts with vocabulary size"
      - name: attribution_saliency_maps
        primary_pattern: scalarfield
        secondary_patterns: [graphnet]
        best_framework: plotly
        alt_framework: matplotlib
        interaction_tiers: [t1, t4]
        ux_rules:
          - "Token-level gradient attribution overlaid on input text"
          - "Integrated gradients with baseline comparison"
        gotchas:
          - "Saliency can be saturated - attributions near zero do not mean unimportant"
      - name: counterfactual_analysis
        primary_pattern: decisionprocess
        secondary_patterns: [graphnet]
        best_framework: plotly
        alt_framework: matplotlib
        interaction_tiers: [t1, t3]
        ux_rules:
          - "Minimal input perturbation that flips prediction"
          - "Counterfactual path in embedding space shown"
        gotchas:
          - "Adversarial examples may not be semantically meaningful counterfactuals"
      - name: speculative_decoding
        primary_pattern: processanim
        secondary_patterns: [graphnet]
        best_framework: plotly
        alt_framework: matplotlib
        interaction_tiers: [t1, t2]
        ux_rules:
          - "Draft model tokens accepted/rejected highlighted green/red"
          - "Speedup vs acceptance rate trade-off curve"
        gotchas:
          - "Draft model too small lowers acceptance rate; too large negates speedup"

  rl_decision_processes:
    concepts:
      - name: mdp_state_transition_graph
        primary_pattern: graphnet
        secondary_patterns: [decisionprocess]
        best_framework: plotly
        alt_framework: graphviz
        interaction_tiers: [t1, t2]
        ux_rules:
          - "States as nodes, actions as edges, rewards as edge weights"
          - "Transition probabilities labeled on edges"
        gotchas:
          - "State space explosion in continuous or high-dimensional MDPs"
      - name: value_function_v_q
        primary_pattern: scalarfield
        secondary_patterns: [decisionprocess]
        best_framework: plotly
        alt_framework: matplotlib
        interaction_tiers: [t1, t4]
        ux_rules:
          - "State-value V(s) heatmap and action-value Q(s,a) as overlaid bars"
          - "Bellman optimality equation visualized as backup diagram"
        gotchas:
          - "Value function approximation errors propagate via bootstrapping"
      - name: policy_visualization
        primary_pattern: vectorfield
        secondary_patterns: [decisionprocess]
        best_framework: plotly
        alt_framework: matplotlib
        interaction_tiers: [t1, t3]
        ux_rules:
          - "Policy pi(a|s) as probability distribution over actions per state"
          - "Policy improvement direction arrows in state space"
        gotchas:
          - "Stochastic policy entropy collapse causes premature convergence"
      - name: episodic_trajectory
        primary_pattern: processanim
        secondary_patterns: [phasetraj]
        best_framework: plotly
        alt_framework: matplotlib
        interaction_tiers: [t1, t2]
        ux_rules:
          - "Agent path in state space with reward events as color-coded points"
          - "Cumulative return annotated along trajectory"
        gotchas:
          - "Sparse reward environments have long credit assignment horizons"
      - name: reward_curve
        primary_pattern: signalflow
        secondary_patterns: [probdist]
        best_framework: matplotlib
        alt_framework: plotly
        interaction_tiers: [t1, t4]
        ux_rules:
          - "Episode return smoothed with exponential moving average"
          - "Min/max envelope across seeds shown as confidence band"
        gotchas:
          - "Reward hacking: agent exploits specification rather than intended behavior"
      - name: multi_agent_interaction
        primary_pattern: graphnet
        secondary_patterns: [processanim]
        best_framework: plotly
        alt_framework: matplotlib
        interaction_tiers: [t1, t3]
        ux_rules:
          - "Joint action space as product of individual action spaces"
          - "Emergent coordination or competition dynamics animated"
        gotchas:
          - "Non-stationarity from other agents learning breaks single-agent assumptions"
      - name: actor_critic_architecture
        primary_pattern: graphnet
        secondary_patterns: [signalflow]
        best_framework: plotly
        alt_framework: matplotlib
        interaction_tiers: [t2, t4]
        ux_rules:
          - "Actor and critic networks with shared encoder layers highlighted"
          - "Advantage estimate A = Q - V or GAE shown"
        gotchas:
          - "Critic learning rate too high destabilizes actor updates"
      - name: ppo_clipping_trpo_trust_region
        primary_pattern: phasetraj
        secondary_patterns: [decisionprocess]
        best_framework: plotly
        alt_framework: matplotlib
        interaction_tiers: [t1, t4]
        ux_rules:
          - "Probability ratio r(theta) clipped region shaded"
          - "KL divergence constraint vs clipping comparison"
        gotchas:
          - "Clipping objective can ignore policy changes when advantage has wrong sign"
      - name: exploration_exploitation_tradeoff
        primary_pattern: decisionprocess
        secondary_patterns: [probdist]
        best_framework: plotly
        alt_framework: matplotlib
        interaction_tiers: [t1, t3]
        ux_rules:
          - "Epsilon-greedy or UCB schedule vs cumulative regret"
          - "Optimal arm pull fraction approaching 1 over time"
        gotchas:
          - "Pure exploration forever yields linear regret - must decay appropriately"

  mechanistic_interpretability:
    concepts:
      - name: circuit_discovery
        primary_pattern: graphnet
        secondary_patterns: [scalarfield]
        best_framework: plotly
        alt_framework: graphviz
        interaction_tiers: [t1, t3]
        ux_rules:
          - "Cleaned attribution graph with indirect effect edges"
          - "Circuit components (attention heads, MLP neurons) labeled by function"
        gotchas:
          - "Attribution patching underestimates indirect effects via correlated features"
      - name: sparse_autoencoders
        primary_pattern: scalarfield
        secondary_patterns: [probdist]
        best_framework: plotly
        alt_framework: matplotlib
        interaction_tiers: [t1, t4]
        ux_rules:
          - "Feature activation histogram with top activating examples"
          - "Dictionary learning loss and L0 sparsity trade-off"
        gotchas:
          - "Feature splitting: single true feature represented by multiple latents"
      - name: superposition_geometry
        primary_pattern: geom3d
        secondary_patterns: [graphnet]
        best_framework: plotly
        alt_framework: matplotlib
        interaction_tiers: [t1, t4]
        ux_rules:
          - "Feature directions as vectors in neuron activation space"
          - "Interference (cosine similarity) between features visualized"
        gotchas:
          - "Superposition is model-size dependent - larger models may use dedicated dimensions"
      - name: activation_patching_causal_tracing
        primary_pattern: processanim
        secondary_patterns: [graphnet]
        best_framework: plotly
        alt_framework: matplotlib
        interaction_tiers: [t1, t3]
        ux_rules:
          - "Corrupted vs restored run comparison with logit difference heatmap"
          - "Causal chain from subject to prediction token traced"
        gotchas:
          - "Activation patching shows necessity, not sufficiency"
      - name: indirect_object_identification
        primary_pattern: graphnet
        secondary_patterns: [scalarfield]
        best_framework: plotly
        alt_framework: matplotlib
        interaction_tiers: [t1, t4]
        ux_rules:
          - "Name-mover and S-inhibition head roles in circuit"
          - "Logit attribution flow to indirect object vs direct object"
        gotchas:
          - "IOI circuit varies by model size and training data composition"

  multi_modal_cross_modal:
    concepts:
      - name: clip_joint_embedding_space
        primary_pattern: geom3d
        secondary_patterns: [graphnet]
        best_framework: plotly
        alt_framework: umap-learn
        interaction_tiers: [t1, t3]
        ux_rules:
          - "Image and text embeddings in shared space with modality color"
          - "Alignment score (cosine similarity) annotated for pairs"
        gotchas:
          - "CLIP embeddings biased by training data stereotypes"
      - name: cross_attention_image_text
        primary_pattern: scalarfield
        secondary_patterns: [graphnet]
        best_framework: plotly
        alt_framework: matplotlib
        interaction_tiers: [t1, t4]
        ux_rules:
          - "Text token attending to image patches as attention map overlay"
          - "Multi-head cross-attention diversity across layers"
        gotchas:
          - "Attention maps can be diffuse - use rollout or gradient for sharper localization"
      - name: vlm_generation_trace
        primary_pattern: processanim
        secondary_patterns: [graphnet]
        best_framework: plotly
        alt_framework: matplotlib
        interaction_tiers: [t1, t2]
        ux_rules:
          - "Token-by-token generation with attended image regions highlighted"
          - "Hallucination detection via attention to irrelevant regions"
        gotchas:
          - "VLMs often hallucinate object counts and spatial relationships"
      - name: image_generation_trajectory
        primary_pattern: processanim
        secondary_patterns: [scalarfield]
        best_framework: plotly
        alt_framework: matplotlib
        interaction_tiers: [t1, t2]
        ux_rules:
          - "Latent diffusion denoising steps shown as image sequence"
          - "Text conditioning strength vs visual fidelity trade-off"
        gotchas:
          - "Classifier-free guidance scale too high causes unnatural saturation"
