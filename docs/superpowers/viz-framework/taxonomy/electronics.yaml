domain: electronics
sub_disciplines:
  circuit_theory:
    concepts:
      - name: impedance_transfer_function
        primary_pattern: signalflow
        secondary_patterns: [graphnet]
        best_framework: matplotlib
        alt_framework: plotly
        interaction_tiers: [t1, t4]
        ux_rules:
          - "Bode plot: log frequency axis, magnitude and phase subplots"
          - "Pole/zero locations annotated on complex plane"
        gotchas:
          - "Phase wrap at +/-180 deg hides true phase margin"
      - name: poles_zeros_stability
        primary_pattern: graphnet
        secondary_patterns: [phasetraj]
        best_framework: plotly
        alt_framework: matplotlib
        interaction_tiers: [t1, t2]
        ux_rules:
          - "Root locus with arrow direction for increasing gain"
          - "Unstable region (RHP) shaded red"
        gotchas:
          - "RHP pole and RHP zero have opposite effects on phase - do not cancel blindly"
      - name: two_port_networks
        primary_pattern: graphnet
        secondary_patterns: [signalflow]
        best_framework: matplotlib
        alt_framework: plotly
        interaction_tiers: [t1, t4]
        ux_rules:
          - "S/Z/Y parameters as matrix heatmap or table"
          - "Reciprocity check: Z12=Z21 for passive networks"
        gotchas:
          - "Reference impedance mismatch causes re-normalization errors"
      - name: nodal_analysis
        primary_pattern: graphnet
        secondary_patterns: [signalflow]
        best_framework: schemdraw
        alt_framework: matplotlib
        interaction_tiers: [t2, t4]
        ux_rules:
          - "Node voltages labeled on schematic with reference ground"
          - "KCL equations shown alongside current arrows"
        gotchas:
          - "Floating nodes without DC path cause SPICE convergence failure"
      - name: mesh_analysis
        primary_pattern: graphnet
        secondary_patterns: [signalflow]
        best_framework: schemdraw
        alt_framework: matplotlib
        interaction_tiers: [t2, t4]
        ux_rules:
          - "Mesh currents drawn as loops with direction arrows"
          - "KVL equations linked to each mesh"
        gotchas:
          - "Current sources on mesh boundaries complicate supermesh formation"

  analog_building_blocks:
    concepts:
      - name: amplifier_topologies
        primary_pattern: signalflow
        secondary_patterns: [graphnet]
        best_framework: schemdraw
        alt_framework: matplotlib
        interaction_tiers: [t2, t4]
        ux_rules:
          - "Small-signal model shown alongside schematic"
          - "Gain, input/output impedance annotated"
        gotchas:
          - "Ignoring Early effect (VA) causes gain error in simple models"
      - name: differential_pair
        primary_pattern: signalflow
        secondary_patterns: [graphnet]
        best_framework: schemdraw
        alt_framework: plotly
        interaction_tiers: [t1, t2, t4]
        ux_rules:
          - "Tail current source shown explicitly"
          - "Differential vs common-mode gain comparison"
        gotchas:
          - "CMRR degradation from device mismatch not shown in ideal model"
      - name: current_mirrors
        primary_pattern: graphnet
        secondary_patterns: [signalflow]
        best_framework: schemdraw
        alt_framework: matplotlib
        interaction_tiers: [t2, t4]
        ux_rules:
          - "Reference and mirrored branches color-coded"
          - "Channel-length modulation effect on mirror ratio"
        gotchas:
          - "VDS mismatch between reference and output devices causes current error"
      - name: op_amp_metrics
        primary_pattern: signalflow
        secondary_patterns: [graphnet]
        best_framework: matplotlib
        alt_framework: plotly
        interaction_tiers: [t1, t4]
        ux_rules:
          - "Open-loop gain, GBW, phase margin on single Bode plot"
          - "Slew rate shown as max dV/dt on step response"
        gotchas:
          - "Phase margin read at unity-gain frequency, not gain-crossover of 0 dB if multiple crossings"
      - name: active_filters
        primary_pattern: signalflow
        secondary_patterns: [graphnet]
        best_framework: matplotlib
        alt_framework: plotly
        interaction_tiers: [t1, t4]
        ux_rules:
          - "Magnitude response with passband and stopband shaded"
          - "Pole-zero plot linked to filter type (Butterworth, Chebyshev, etc.)"
        gotchas:
          - "Sallen-Key Q sensitivity to component tolerance"
      - name: oscillators
        primary_pattern: phasetraj
        secondary_patterns: [signalflow]
        best_framework: matplotlib
        alt_framework: plotly
        interaction_tiers: [t1, t2]
        ux_rules:
          - "Barkhausen criterion annotated: loop gain = 1, phase = 0 deg"
          - "Startup transient vs steady-state limit cycle"
        gotchas:
          - "Amplitude stabilization mechanism (nonlinearity) often omitted"
      - name: bandgap_reference
        primary_pattern: graphnet
        secondary_patterns: [signalflow]
        best_framework: schemdraw
        alt_framework: matplotlib
        interaction_tiers: [t2, t4]
        ux_rules:
          - "VBE and DeltaVBE contributions shown as temperature-compensated sum"
          - "Output voltage vs temperature curve with curvature correction"
        gotchas:
          - "Op-amp offset voltage causes reference spread across process corners"
      - name: ldo_regulator
        primary_pattern: signalflow
        secondary_patterns: [graphnet]
        best_framework: matplotlib
        alt_framework: plotly
        interaction_tiers: [t1, t4]
        ux_rules:
          - "Load transient response with undershoot/overshoot annotated"
          - "Dropout voltage region clearly marked"
        gotchas:
          - "Stability with low-ESR ceramic output capacitors requires internal compensation zero"
      - name: pll_dll
        primary_pattern: signalflow
        secondary_patterns: [phasetraj]
        best_framework: matplotlib
        alt_framework: plotly
        interaction_tiers: [t1, t2]
        ux_rules:
          - "Phase noise spectrum in dBc/Hz with integrated jitter"
          - "Lock acquisition transient shown in phase plane"
        gotchas:
          - "False lock on harmonics or sub-harmonics of reference"
      - name: adc_architectures
        primary_pattern: signalflow
        secondary_patterns: [graphnet]
        best_framework: matplotlib
        alt_framework: plotly
        interaction_tiers: [t2, t4]
        ux_rules:
          - "Transfer function (code vs voltage) with ideal line and DNL/INL deviation"
          - "Spectral FFT with THD and SNDR annotated"
        gotchas:
          - "Missing codes or non-monotonicity in flash ADC from comparator offset"
      - name: charge_pump_dc_dc
        primary_pattern: signalflow
        secondary_patterns: [graphnet]
        best_framework: matplotlib
        alt_framework: schemdraw
        interaction_tiers: [t1, t4]
        ux_rules:
          - "Steady-state inductor current ripple and capacitor voltage ripple"
          - "Continuous vs discontinuous conduction mode boundary"
        gotchas:
          - "Right-half-plane zero in boost converter limits achievable bandwidth"
  semiconductor_device_physics:
    concepts:
      - name: band_diagrams
        primary_pattern: graphnet
        secondary_patterns: [scalarfield]
        best_framework: plotly
        alt_framework: matplotlib
        interaction_tiers: [t1, t2]
        ux_rules:
          - "Conduction band, valence band, Fermi level clearly labeled and color-coded"
          - "Band bending aligned with charge density profile"
        gotchas:
          - "Electron energy vs electrostatic potential sign confusion"
      - name: carrier_transport
        primary_pattern: vectorfield
        secondary_patterns: [scalarfield]
        best_framework: plotly
        alt_framework: matplotlib
        interaction_tiers: [t1, t4]
        ux_rules:
          - "Drift and diffusion current components shown separately"
          - "Velocity saturation region annotated on v-E curve"
        gotchas:
          - "Saturation velocity vs saturation current - different phenomena"
      - name: pn_junction_iv_cv
        primary_pattern: graphnet
        secondary_patterns: [signalflow]
        best_framework: plotly
        alt_framework: matplotlib
        interaction_tiers: [t1, t2]
        ux_rules:
          - "I-V semilog plot with ideality factor and IS extracted"
          - "C-V profile with depletion width and doping extracted"
        gotchas:
          - "Series resistance distorts I-V at high current - correct with Rs extraction"
      - name: mosfet_operation
        primary_pattern: graphnet
        secondary_patterns: [signalflow]
        best_framework: plotly
        alt_framework: matplotlib
        interaction_tiers: [t1, t2, t4]
        ux_rules:
          - "Id-Vgs and Id-Vds curves with triode/saturation regions shaded"
          - "gm and ro extraction points marked"
        gotchas:
          - "Subthreshold swing confused with transconductance efficiency"
      - name: mosfet_capacitances
        primary_pattern: signalflow
        secondary_patterns: [graphnet]
        best_framework: matplotlib
        alt_framework: plotly
        interaction_tiers: [t1, t4]
        ux_rules:
          - "Cgs, Cgd, Cdb vs Vgs/Vds multi-panel plot"
          - "Miller multiplication region annotated"
        gotchas:
          - "Cgd non-monotonicity in strong inversion often missed"
  nanoscale_effects:
    concepts:
      - name: short_channel_effects
        primary_pattern: signalflow
        secondary_patterns: [graphnet]
        best_framework: plotly
        alt_framework: matplotlib
        interaction_tiers: [t1, t4]
        ux_rules:
          - "Vth roll-off, DIBL, subthreshold swing degradation vs L"
          - "Long-channel reference curve overlaid for comparison"
        gotchas:
          - "DIBL and punchthrough confused - DIBL is Vth shift, punchthrough is leakage"
      - name: gaa_nanosheets
        primary_pattern: geom3d
        secondary_patterns: [scalarfield]
        best_framework: pyvista
        alt_framework: plotly
        interaction_tiers: [t1, t4]
        ux_rules:
          - "3D structure with gate-all-around geometry"
          - "Sheet width and stacking count as adjustable parameters"
        gotchas:
          - "Corner effects in nanosheets create parasitic corner devices"
      - name: quantum_tunneling
        primary_pattern: scalarfield
        secondary_patterns: [probdist]
        best_framework: plotly
        alt_framework: matplotlib
        interaction_tiers: [t1, t4]
        ux_rules:
          - "Barrier shape and wavefunction penetration depth shown"
          - "Transmission probability vs barrier thickness"
        gotchas:
          - "Direct tunneling vs Fowler-Nordheim tunneling regimes"
      - name: process_variation
        primary_pattern: probdist
        secondary_patterns: [scalarfield]
        best_framework: plotly
        alt_framework: matplotlib
        interaction_tiers: [t5, t6]
        ux_rules:
          - "Distribution of Vth, Id across wafer or Monte Carlo sample"
          - "Corner cases (SS, SF, FS, FF) highlighted"
        gotchas:
          - "Spatial correlation of variation ignored in simple Monte Carlo"
      - name: self_heating_electrothermal
        primary_pattern: scalarfield
        secondary_patterns: [processanim]
        best_framework: plotly
        alt_framework: matplotlib
        interaction_tiers: [t1, t5]
        ux_rules:
          - "Temperature map overlaid on device geometry"
          - "I-V collapse at high power annotated with temperature"
        gotchas:
          - "Self-heating time constant much slower than electrical - mismatch in transient simulation"
      - name: rtn_noise
        primary_pattern: signalflow
        secondary_patterns: [probdist]
        best_framework: matplotlib
        alt_framework: plotly
        interaction_tiers: [t1, t4]
        ux_rules:
          - "Random telegraph signal in time domain with amplitude levels"
          - "Capture/emission time constants from hidden Markov fit"
        gotchas:
          - "RTN amplitude distribution often non-Gaussian and device-dependent"
      - name: nc_fet
        primary_pattern: graphnet
        secondary_patterns: [signalflow]
        best_framework: plotly
        alt_framework: matplotlib
        interaction_tiers: [t1, t4]
        ux_rules:
          - "Sub-60 mV/decade swing demonstrated on Id-Vgs"
          - "Ferroelectric polarization charge linked to S-factor"
        gotchas:
          - "Hysteresis from ferroelectric can cause memory window instead of steep swing"
      - name: tunnel_fet
        primary_pattern: scalarfield
        secondary_patterns: [signalflow]
        best_framework: plotly
        alt_framework: matplotlib
        interaction_tiers: [t1, t4]
        ux_rules:
          - "Band-to-band tunneling path shown in band diagram"
          - "Point subthreshold swing vs average swing distinction"
        gotchas:
          - "On-current severely limited by tunneling probability"
      - name: two_d_material_fets
        primary_pattern: geom3d
        secondary_patterns: [scalarfield]
        best_framework: pyvista
        alt_framework: plotly
        interaction_tiers: [t1, t3]
        ux_rules:
          - "Monolayer or few-layer thickness visualization"
          - "Ballistic transport regime annotation"
        gotchas:
          - "Contact resistance dominates in 2D devices - extrinsic vs intrinsic performance"
      - name: memristor_rram
        primary_pattern: phasetraj
        secondary_patterns: [signalflow]
        best_framework: plotly
        alt_framework: matplotlib
        interaction_tiers: [t1, t2]
        ux_rules:
          - "Pinched hysteresis I-V loop with SET and RESET directions"
          - "Filament formation animation in conductive bridge"
        gotchas:
          - "Variability between cycles (cycle-to-cycle) and devices (device-to-device)"
      - name: fefet
        primary_pattern: graphnet
        secondary_patterns: [signalflow]
        best_framework: plotly
        alt_framework: matplotlib
        interaction_tiers: [t1, t4]
        ux_rules:
          - "Polarization-voltage hysteresis loop linked to threshold shift"
          - "Memory window vs endurance trade-off"
        gotchas:
          - "Wake-up and fatigue effects change polarization loop shape over cycles"
      - name: variability_monte_carlo
        primary_pattern: probdist
        secondary_patterns: [signalflow]
        best_framework: plotly
        alt_framework: matplotlib
        interaction_tiers: [t5, t6]
        ux_rules:
          - "Histograms of key metrics (delay, power, yield)"
          - "Sensitivity analysis with tornado chart"
        gotchas:
          - "Latin hypercube sampling needed for rare-event tails"
      - name: reliability_em_td
        primary_pattern: signalflow
        secondary_patterns: [probdist]
        best_framework: matplotlib
        alt_framework: plotly
        interaction_tiers: [t2, t5]
        ux_rules:
          - "Black's equation fit for electromigration lifetime"
          - "TDDB Weibull plot with beta and t63 extraction"
        gotchas:
          - "Acceleration factors (Eaa, gamma) extrapolated beyond measurement range"

  signal_integrity:
    concepts:
      - name: transmission_lines
        primary_pattern: signalflow
        secondary_patterns: [vectorfield]
        best_framework: matplotlib
        alt_framework: plotly
        interaction_tiers: [t1, t4]
